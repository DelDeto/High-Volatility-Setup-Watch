name: Freqtrade Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of Gate futures history to download"
        required: true
        default: "180"
      timerange:
        description: "Optional Freqtrade timerange, e.g. 20260101-20260930"
        required: false
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pull Freqtrade stable
        run: docker compose pull
      - name: Download 15m / 1h / 4h futures data
        run: |
          set -euo pipefail
          docker compose run --rm freqtrade download-data --config /freqtrade/user_data/config-backtest.json --timeframes 15m 1h 4h --days "${{ inputs.days }}" 2>&1 | tee /tmp/download.log
          if grep -Eq "CRITICAL|ERROR -" /tmp/download.log; then exit 1; fi
      - name: Backtest strategy
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${{ inputs.timerange }}" ]; then EXTRA_ARGS+=(--timerange "${{ inputs.timerange }}"); fi
          docker compose run --rm freqtrade backtesting --config /freqtrade/user_data/config-backtest.json --strategy MarketOpportunityStrategy "${EXTRA_ARGS[@]}" 2>&1 | tee /tmp/backtest.log
          if grep -Eq "CRITICAL|ERROR -" /tmp/backtest.log; then exit 1; fi
      - name: Lookahead analysis
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${{ inputs.timerange }}" ]; then EXTRA_ARGS+=(--timerange "${{ inputs.timerange }}"); fi
          docker compose run --rm freqtrade lookahead-analysis --config /freqtrade/user_data/config-backtest.json --strategy MarketOpportunityStrategy "${EXTRA_ARGS[@]}" 2>&1 | tee /tmp/lookahead.log
          if grep -Eq "CRITICAL|ERROR -" /tmp/lookahead.log; then exit 1; fi
      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freqtrade-backtest-results
          path: user_data/backtest_results/
          if-no-files-found: ignore
