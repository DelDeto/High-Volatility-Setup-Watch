name: Inspect Gate Contract Types

on:
  push:
    branches:
      - freqtrade-migration

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull Freqtrade stable
        run: docker compose pull
      - name: Print Gate contract classifications
        run: |
          docker compose run -T --rm --entrypoint python freqtrade - <<'PY'
          import ccxt
          e = ccxt.gate({"options": {"defaultType": "swap"}})
          markets = e.load_markets()
          wanted = ["BTC/USDT:USDT","ETH/USDT:USDT","XAU/USDT:USDT","US30/USDT:USDT","VOO/USDT:USDT","XIAOMI/USDT:USDT","EUR/USDT:USDT"]
          for s in wanted:
              m = markets.get(s)
              if m:
                  print("TYPE", s, repr(m.get("info", {}).get("contract_type")))
          vals = {}
          for s,m in markets.items():
              if m.get("swap") and m.get("settle") == "USDT":
                  v = m.get("info", {}).get("contract_type")
                  vals[v] = vals.get(v, 0) + 1
          print("COUNTS", vals)
          PY
