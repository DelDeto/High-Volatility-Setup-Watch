name: Research Backtest V2 - 90d

on:
  push:
    branches:
      - freqtrade-migration
    paths:
      - "user_data/strategies/MarketOpportunityStrategy.py"
      - "user_data/config-backtest.json"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pull Freqtrade stable
        run: docker compose pull

      - name: Download 90d research data
        run: |
          set -euo pipefail
          docker compose run --rm freqtrade download-data \
            --config /freqtrade/user_data/config-backtest.json \
            --timeframes 15m 1h 4h \
            --days 90 2>&1 | tee /tmp/download.log
          if grep -Eq "CRITICAL|ERROR -" /tmp/download.log; then exit 1; fi

      - name: Run 90d research backtest
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker compose run --rm freqtrade backtesting \
            --config /freqtrade/user_data/config-backtest.json \
            --strategy MarketOpportunityStrategy \
            --export trades \
            2>&1 | tee /tmp/research-v2.log
          cp /tmp/research-v2.log artifacts/research-v2.log
          if grep -Eq "CRITICAL|ERROR -" /tmp/research-v2.log; then exit 1; fi

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-backtest-v2
          path: |
            user_data/backtest_results/
            artifacts/research-v2.log
          if-no-files-found: error
