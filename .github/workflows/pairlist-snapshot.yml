name: Snapshot Dynamic Pairlist

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull Freqtrade stable
        run: docker compose pull

      - name: Generate current Binance futures pairlist
        run: |
          mkdir -p artifacts
          docker compose run --rm freqtrade test-pairlist \
            --config /freqtrade/user_data/config.json \
            --print-json | tee artifacts/pairlist.json

      - name: Upload pairlist snapshot
        uses: actions/upload-artifact@v4
        with:
          name: binance-futures-pairlist
          path: artifacts/pairlist.json
