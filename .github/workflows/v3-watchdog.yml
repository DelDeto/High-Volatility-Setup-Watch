name: V3.3 Scanner Watchdog

on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:
    inputs:
      force_recovery:
        description: "Force a recovery scan even if the primary scanner is healthy"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - v3.3-watchdog
      - main
    paths:
      - ".github/workflows/v3-watchdog.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: v3-scanner-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PRIMARY_WORKFLOW: v3-market-scan.yml
      STALE_SECONDS: "1200"
    steps:
      - name: Inspect primary scanner health
        id: health
        shell: bash
        env:
          FORCE_INPUT: ${{ inputs.force_recovery }}
        run: |
          set -euo pipefail

          NOW=$(date +%s)
          FORCE="false"

          # A push to main only happens when this watchdog is deployed/changed.
          # Use it as a one-time end-to-end recovery test.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            FORCE="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "$FORCE_INPUT" == "true" ]]; then
            FORCE="true"
          fi

          RUNS=$(gh api             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/workflows/${PRIMARY_WORKFLOW}/runs?per_page=30")

          LATEST=$(echo "$RUNS" | jq -c '
            [.workflow_runs[]
             | select(.event == "schedule" or .event == "workflow_dispatch")]
            | sort_by(.created_at)
            | reverse
            | .[0] // null
          ')

          if [[ "$LATEST" == "null" ]]; then
            AGE=999999
            STATUS="missing"
            CONCLUSION="none"
            LAST_URL=""
            LAST_CREATED=""
          else
            LAST_CREATED=$(echo "$LATEST" | jq -r '.created_at')
            STATUS=$(echo "$LATEST" | jq -r '.status')
            CONCLUSION=$(echo "$LATEST" | jq -r '.conclusion // "none"')
            LAST_URL=$(echo "$LATEST" | jq -r '.html_url')
            LAST_EPOCH=$(date -d "$LAST_CREATED" +%s)
            AGE=$((NOW - LAST_EPOCH))
          fi

          echo "Latest production run: created=$LAST_CREATED status=$STATUS conclusion=$CONCLUSION age=${AGE}s"
          echo "latest_url=$LAST_URL" >> "$GITHUB_OUTPUT"
          echo "age_seconds=$AGE" >> "$GITHUB_OUTPUT"

          HEALTHY="false"
          if (( AGE <= STALE_SECONDS )); then
            if [[ "$STATUS" == "queued" || "$STATUS" == "in_progress" ]]; then
              HEALTHY="true"
            elif [[ "$STATUS" == "completed" && "$CONCLUSION" == "success" ]]; then
              HEALTHY="true"
            fi
          fi

          RECOVER="false"
          REASON=""
          if [[ "$FORCE" == "true" ]]; then
            RECOVER="true"
            REASON="forced_watchdog_test"
          elif [[ "$HEALTHY" != "true" ]]; then
            RECOVER="true"
            if (( AGE > STALE_SECONDS )); then
              REASON="scanner_stale_${AGE}s"
            else
              REASON="latest_production_run_${CONCLUSION}"
            fi
          fi

          echo "healthy=$HEALTHY" >> "$GITHUB_OUTPUT"
          echo "recover=$RECOVER" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Healthy heartbeat
        if: steps.health.outputs.recover != 'true'
        run: |
          echo "Primary V3.2 scanner is healthy. No recovery needed."

      - name: Send watchdog recovery alert
        if: steps.health.outputs.recover == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          AGE_MIN=$(( ${{ steps.health.outputs.age_seconds }} / 60 ))
          TEXT="⚠️ V3.3 WATCHDOG

Primary scanner needs recovery.
Reason: ${{ steps.health.outputs.reason }}
Last production scan age: ${AGE_MIN} min

Watchdog is starting a replacement V3.2 scan now."

          RESPONSE=$(curl -sS -X POST             "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"             --data-urlencode "text=$TEXT")

          echo "$RESPONSE" | jq -e '.ok == true' >/dev/null

      - name: Dispatch replacement production scan
        id: dispatch
        if: steps.health.outputs.recover == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          START_EPOCH=$(date +%s)
          echo "start_epoch=$START_EPOCH" >> "$GITHUB_OUTPUT"

          gh workflow run "$PRIMARY_WORKFLOW"             --repo "$GITHUB_REPOSITORY"             --ref main             -f send_telegram=true             -f universe=150             -f deep_limit=80             -f top_n=10

          echo "Recovery workflow_dispatch submitted."

      - name: Verify recovery completed
        if: steps.health.outputs.recover == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          START_EPOCH=${{ steps.dispatch.outputs.start_epoch }}
          DEADLINE=$(( $(date +%s) + 540 ))
          RECOVERY_ID=""

          while (( $(date +%s) < DEADLINE )); do
            RUNS=$(gh api               -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/workflows/${PRIMARY_WORKFLOW}/runs?per_page=20")

            CANDIDATE=$(echo "$RUNS" | jq -c --argjson start "$START_EPOCH" '
              [.workflow_runs[]
               | select(.event == "workflow_dispatch")
               | . + {epoch: (.created_at | fromdateiso8601)}
               | select(.epoch >= ($start - 10))]
              | sort_by(.epoch)
              | reverse
              | .[0] // null
            ')

            if [[ "$CANDIDATE" != "null" ]]; then
              RECOVERY_ID=$(echo "$CANDIDATE" | jq -r '.id')
              STATUS=$(echo "$CANDIDATE" | jq -r '.status')
              CONCLUSION=$(echo "$CANDIDATE" | jq -r '.conclusion // "none"')
              URL=$(echo "$CANDIDATE" | jq -r '.html_url')
              echo "Recovery run $RECOVERY_ID: status=$STATUS conclusion=$CONCLUSION"

              if [[ "$STATUS" == "completed" ]]; then
                if [[ "$CONCLUSION" == "success" ]]; then
                  TEXT="✅ V3.3 WATCHDOG RECOVERED

Replacement market scan completed successfully.
The normal 15-minute monitoring cycle is restored."
                  curl -sS -X POST                     "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"                     --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"                     --data-urlencode "text=$TEXT" | jq -e '.ok == true' >/dev/null
                  exit 0
                fi

                TEXT="🚨 V3.3 WATCHDOG RECOVERY FAILED

Replacement scan finished with: $CONCLUSION
Immediate manual inspection is required.
$URL"
                curl -sS -X POST                   "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"                   --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"                   --data-urlencode "text=$TEXT" | jq -e '.ok == true' >/dev/null
                exit 1
              fi
            fi

            sleep 20
          done

          TEXT="🚨 V3.3 WATCHDOG TIMEOUT

A replacement scan was dispatched but did not complete within the watchdog window.
Please inspect GitHub Actions."
          curl -sS -X POST             "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"             --data-urlencode "text=$TEXT" | jq -e '.ok == true' >/dev/null
          exit 1
