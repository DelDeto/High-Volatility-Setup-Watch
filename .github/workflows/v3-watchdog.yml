name: V3.4 Redundancy Watchdog

on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:
    inputs:
      force_recovery:
        description: "Force a recovery scan"
        required: false
        default: "false"
  push:
    branches:
      - v3.4-free-redundancy
      - v3.4-external-watchdog
      - v3.4.5-state-branch
      - main
    paths:
      - ".github/workflows/v3-watchdog.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: v3-scanner-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Inspect scanner heartbeat and delivery queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: "-1003984243045"
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          FORCE_INPUT: ${{ inputs.force_recovery }}
          PRIMARY_WORKFLOW: v3-market-scan.yml
          STALE_SECONDS: "1500"
          DELIVERY_STALE_SECONDS: "1200"
        run: |
          set -euo pipefail
          NOW=$(date +%s)

          telegram_send_all() {
            local message="$1"
            local sent_group="false"
            for chat_id in "${TELEGRAM_CHAT_ID:-}" "${TELEGRAM_GROUP_CHAT_ID:-}"; do
              [[ -z "$chat_id" ]] && continue
              if [[ "$chat_id" == "${TELEGRAM_CHAT_ID:-}" && "$sent_group" == "true" ]]; then
                continue
              fi
              curl -fsS -X POST \
                "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                --data-urlencode "chat_id=$chat_id" \
                --data-urlencode "text=$message" >/dev/null
              if [[ "$chat_id" == "${TELEGRAM_GROUP_CHAT_ID:-}" ]]; then
                sent_group="true"
              fi
            done
          }

          RUNS=$(gh api -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/workflows/$PRIMARY_WORKFLOW/runs?per_page=30")

          LATEST=$(echo "$RUNS" | jq -c '
            [.workflow_runs[]
             | select(.event == "schedule" or .event == "workflow_dispatch")]
            | sort_by(.created_at) | reverse | .[0] // null
          ')

          RUN_AGE=999999
          RUN_STATUS="missing"
          RUN_CONCLUSION="none"
          if [[ "$LATEST" != "null" ]]; then
            RUN_CREATED=$(echo "$LATEST" | jq -r '.created_at')
            RUN_STATUS=$(echo "$LATEST" | jq -r '.status')
            RUN_CONCLUSION=$(echo "$LATEST" | jq -r '.conclusion // "none"')
            RUN_EPOCH=$(date -d "$RUN_CREATED" +%s)
            RUN_AGE=$((NOW - RUN_EPOCH))
          fi

          HEARTBEAT_JSON=$(gh api             -H "Accept: application/vnd.github.raw+json"             "/repos/$GITHUB_REPOSITORY/contents/user_data/v3_state/scan_state.json?ref=v3-state"             2>/dev/null || echo '{}')

          HEARTBEAT_AT=$(echo "$HEARTBEAT_JSON" | jq -r '.last_completed_at // empty' 2>/dev/null || true)
          HEARTBEAT_AGE=999999
          if [[ -n "$HEARTBEAT_AT" ]]; then
            HEARTBEAT_EPOCH=$(date -d "$HEARTBEAT_AT" +%s)
            HEARTBEAT_AGE=$((NOW - HEARTBEAT_EPOCH))
          fi

          DELIVERY_JSON=$(gh api             -H "Accept: application/vnd.github.raw+json"             "/repos/$GITHUB_REPOSITORY/contents/user_data/v3_state/delivery.json?ref=v3-state"             2>/dev/null || echo '{"items":{}}')

          PENDING_COUNT=$(echo "$DELIVERY_JSON" | jq '[.items[]? | select(.status != "SENT")] | length')
          OLDEST_PENDING=$(echo "$DELIVERY_JSON" | jq -r             '[.items[]? | select(.status != "SENT") | .created_at] | sort | .[0] // empty')

          DELIVERY_AGE=0
          if [[ -n "$OLDEST_PENDING" ]]; then
            DELIVERY_EPOCH=$(date -d "$OLDEST_PENDING" +%s)
            DELIVERY_AGE=$((NOW - DELIVERY_EPOCH))
          fi

          echo "V34_WATCHDOG run_age=$RUN_AGE run_status=$RUN_STATUS run_conclusion=$RUN_CONCLUSION heartbeat_age=$HEARTBEAT_AGE pending=$PENDING_COUNT delivery_age=$DELIVERY_AGE"

          # A recent production job already running is healthy enough to wait.
          IN_FLIGHT="false"
          if (( RUN_AGE <= STALE_SECONDS )) &&              [[ "$RUN_STATUS" == "queued" || "$RUN_STATUS" == "pending" || "$RUN_STATUS" == "in_progress" ]]; then
            IN_FLIGHT="true"
          fi

          FORCE="false"
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" ]]; then
            FORCE="true"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "${FORCE_INPUT:-false}" == "true" ]]; then
            FORCE="true"
          fi

          HEALTHY="false"
          if [[ "$IN_FLIGHT" == "true" ]]; then
            HEALTHY="true"
          elif (( HEARTBEAT_AGE <= STALE_SECONDS )) &&                (( PENDING_COUNT == 0 || DELIVERY_AGE <= DELIVERY_STALE_SECONDS )); then
            HEALTHY="true"
          fi

          if [[ "$REF_NAME" != "refs/heads/main" ]]; then
            echo "Branch test only. healthy=$HEALTHY"
            exit 0
          fi

          if [[ "$FORCE" != "true" && "$HEALTHY" == "true" ]]; then
            echo "V3.4 scanner heartbeat and delivery queue healthy."
            exit 0
          fi

          AGE_MIN=$((HEARTBEAT_AGE / 60))
          DELIVERY_MIN=$((DELIVERY_AGE / 60))

          ALERT=$(printf '%s\n'             "⚠️ V3.4 WATCHDOG"             "Automatic recovery triggered."             "Heartbeat age: ${AGE_MIN} min"             "Pending Telegram items: $PENDING_COUNT (oldest ${DELIVERY_MIN} min)"             "Starting replacement + catch-up scan.")

          telegram_send_all "$ALERT"

          START_EPOCH=$(date +%s)

          gh workflow run "$PRIMARY_WORKFLOW"             --repo "$GITHUB_REPOSITORY"             --ref main             -f send_telegram=true             -f universe=150             -f deep_limit=80             -f top_n=10

          echo "V34_WATCHDOG_DISPATCHED"

          DEADLINE=$(( $(date +%s) + 720 ))
          while (( $(date +%s) < DEADLINE )); do
            sleep 20

            CHECK=$(gh api -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/workflows/$PRIMARY_WORKFLOW/runs?per_page=20")

            CANDIDATE=$(echo "$CHECK" | jq -c --argjson start "$START_EPOCH" '
              [.workflow_runs[]
               | select(.event == "workflow_dispatch" or .event == "schedule")
               | . + {epoch: (.created_at | fromdateiso8601)}
               | select(.epoch >= ($start - 10))]
              | sort_by(.epoch) | reverse | .[0] // null
            ')

            if [[ "$CANDIDATE" == "null" ]]; then
              continue
            fi

            STATUS=$(echo "$CANDIDATE" | jq -r '.status')
            CONCLUSION=$(echo "$CANDIDATE" | jq -r '.conclusion // "none"')
            RUN_URL=$(echo "$CANDIDATE" | jq -r '.html_url')
            echo "V34_RECOVERY status=$STATUS conclusion=$CONCLUSION"

            if [[ "$STATUS" != "completed" ]]; then
              continue
            fi

            if [[ "$CONCLUSION" == "success" ]]; then
              OK=$(printf '%s\n'                 "✅ V3.4 WATCHDOG RECOVERED"                 "Replacement scan + catch-up completed successfully."                 "Pending Telegram delivery was retried."                 "Normal monitoring is restored.")
              telegram_send_all "$OK"
              exit 0
            fi

            FAIL=$(printf '%s\n'               "🚨 V3.4 WATCHDOG RECOVERY FAILED"               "Replacement conclusion: $CONCLUSION"               "$RUN_URL")
            telegram_send_all "$FAIL"
            exit 1
          done

          TIMEOUT=$(printf '%s\n'             "🚨 V3.4 WATCHDOG TIMEOUT"             "Recovery was dispatched but did not complete within 12 minutes.")
          telegram_send_all "$TIMEOUT"
          exit 1
