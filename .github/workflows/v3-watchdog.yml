name: V3.3 Scanner Watchdog

on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:
    inputs:
      force_recovery:
        description: "Force a recovery scan"
        required: false
        default: "false"
  push:
    branches:
      - v3.3-watchdog
    paths:
      - ".github/workflows/v3-watchdog.yml"

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Syntax smoke test
        run: echo "WATCHDOG_YAML_OK"
