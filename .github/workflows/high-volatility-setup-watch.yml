name: High Volatility Setup Watch

on:
  workflow_dispatch:
  schedule:
    # Staggered from Market Setup Watch; shortly after 15M closes.
    - cron: "11,26,41,56 * * * *"

permissions:
  contents: write

concurrency:
  group: high-volatility-setup-watch
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile scanner
        run: |
          python -m py_compile             smc_analysis.py             trade_plan.py             high_vol/config.py             high_vol/mexc_market.py             high_vol/participation.py             high_vol/correlation.py             high_vol/outcomes.py             high_vol/ranker.py             high_vol/scanner.py             high_vol/chart.py             high_vol/notifier.py             high_vol/main.py

      - name: Scan high volatility crypto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m high_vol.main

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: High-Volatility-Setup-Watch
          path: |
            output/high_vol_report.json
            output/high_vol_update.txt
            output/charts/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist scanner state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high_vol/state.json high_vol/outcomes.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update High Volatility Watch state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
