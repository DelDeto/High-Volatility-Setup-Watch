name: V3.2 Market Opportunity Scan

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send unique setup/outcome alerts to Telegram"
        required: true
        type: boolean
        default: false
      universe:
        description: "Liquid Gate pairs for fast scan"
        required: true
        default: "150"
      deep_limit:
        description: "Pairs for 15m/1h/4h deep scan"
        required: true
        default: "80"
      top_n:
        description: "Ranked opportunities to keep"
        required: true
        default: "10"
  push:
    branches:
      - v3.2-visual-signal-pack
      - main
    paths:
      - "user_data/v3/**"
      - "user_data/strategies/MarketOpportunityStrategy.py"
      - ".github/workflows/v3-market-scan.yml"

permissions:
  contents: write

concurrency:
  group: v3-market-opportunity-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Freqtrade stable
        run: docker compose pull

      - name: V3 ranker self-test
        run: |
          docker compose run --rm --entrypoint python freqtrade \
            /freqtrade/user_data/v3/market_ranker.py --self-test

      - name: V3.1 outcome self-test
        run: |
          docker compose run --rm --entrypoint python freqtrade \
            /freqtrade/user_data/v3/outcome_tracker.py --self-test

      - name: V3.2 chart self-test
        run: |
          mkdir -p user_data/v3_output/chart-self-test
          chmod -R 0777 user_data/v3_output
          docker compose run --rm --entrypoint python freqtrade \
            /freqtrade/user_data/v3/chart_generator.py \
            --self-test \
            --output-dir /freqtrade/user_data/v3_output/chart-self-test

      - name: Prepare runtime directories
        run: |
          mkdir -p user_data/v3_output user_data/v3_state user_data/v3_charts
          chmod 0777 user_data/v3_output user_data/v3_state user_data/v3_charts

      - name: Scan Gate market and rank Top-N
        shell: bash
        env:
          INPUT_UNIVERSE: ${{ inputs.universe }}
          INPUT_DEEP: ${{ inputs.deep_limit }}
          INPUT_TOP_N: ${{ inputs.top_n }}
        run: |
          set -euo pipefail
          UNIVERSE="${INPUT_UNIVERSE:-150}"
          DEEP="${INPUT_DEEP:-80}"
          TOP_N="${INPUT_TOP_N:-10}"

          docker compose run --rm \
            --entrypoint python \
            freqtrade \
            /freqtrade/user_data/v3/market_ranker.py \
            --universe "$UNIVERSE" \
            --deep-limit "$DEEP" \
            --top-n "$TOP_N" \
            --output-dir /freqtrade/user_data/v3_output

      - name: CI-test outcome integration
        if: github.event_name == 'push'
        run: |
          docker compose run --rm \
            --entrypoint python \
            freqtrade \
            /freqtrade/user_data/v3/outcome_tracker.py \
            --snapshot /freqtrade/user_data/v3_output/latest.json \
            --state /freqtrade/user_data/v3_output/ci-outcomes.json \
            --summary /freqtrade/user_data/v3_output/ci-outcome-summary.json \
            --chart-dir /freqtrade/user_data/v3_charts

      - name: Track unique setups and outcomes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_SEND: ${{ inputs.send_telegram }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ARGS=(
            --snapshot /freqtrade/user_data/v3_output/latest.json
            --state /freqtrade/user_data/v3_state/outcomes.json
            --summary /freqtrade/user_data/v3_state/outcome_summary.json
            --chart-dir /freqtrade/user_data/v3_charts
          )

          if [[ "$EVENT_NAME" == "schedule" || "$MANUAL_SEND" == "true" ]]; then
            ARGS+=(--telegram)
          fi

          docker compose run --rm \
            --entrypoint python \
            -e TELEGRAM_BOT_TOKEN \
            -e TELEGRAM_CHAT_ID \
            freqtrade \
            /freqtrade/user_data/v3/outcome_tracker.py "${ARGS[@]}"

      - name: Add reports to job summary
        if: always()
        run: |
          if [ -f user_data/v3_output/latest.md ]; then
            cat user_data/v3_output/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "V3 snapshot was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f user_data/v3_state/outcome_summary.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## V3.1 Outcome Summary" >> "$GITHUB_STEP_SUMMARY"
            cat user_data/v3_state/outcome_summary.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist V3.1 outcome state
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add user_data/v3_state/outcomes.json user_data/v3_state/outcome_summary.json

          if git diff --cached --quiet; then
            echo "No outcome-state changes to persist."
            exit 0
          fi

          git commit -m "Update V3.1 outcome state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload V3.1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-market-opportunity-snapshot
          path: |
            user_data/v3_output/
            user_data/v3_state/outcome_summary.json
            user_data/v3_charts/
          if-no-files-found: warn
          retention-days: 90
