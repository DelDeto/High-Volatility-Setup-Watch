name: Exchange Connectivity Probe

on:
  push:
    branches:
      - freqtrade-migration

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull Freqtrade stable
        run: docker compose pull

      - name: Probe supported futures exchanges
        run: |
          set +e
          for EX in bybit okx bitget gate hyperliquid kraken; do
            echo "===== EXCHANGE:$EX ====="
            docker compose run --rm freqtrade list-pairs \
              --exchange "$EX" \
              --quote USDT \
              --trading-mode futures 2>&1 | tee "/tmp/$EX.log"
            RC=$?
            if grep -Eq "CRITICAL|ERROR -" "/tmp/$EX.log"; then
              echo "RESULT:$EX:ERROR"
            elif [ "$RC" -ne 0 ]; then
              echo "RESULT:$EX:ERROR"
            else
              echo "RESULT:$EX:OK"
            fi
          done
          exit 0
